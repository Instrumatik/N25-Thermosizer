name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas de sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar dependencias
        run: pip install -e ".[dev,gui,reports,licensing]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (estricto)
        run: mypy
      - name: Pytest con cobertura del motor
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov --cov-report=term-missing
